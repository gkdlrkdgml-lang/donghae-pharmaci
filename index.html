<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<title>동해시 약국 운영현황</title>
<style>
/* 상황실 관제판: 상단 요약 → 필터 → 약국별 24시간 운영 막대 목록 */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#15202b; --muted:#5b6b7a; --line:#d5dce3;
  --accent:#0b5cad; --open:#12805c; --soon:#b86e00; --closed:#8a94a0; --unk:#7a5bb0;
  --bar:#e3e8ee; --mapbg:#e6ecf1; --barfill:#9fd3bd; --now:#d23b2f;
  --f-body:"IBM Plex Sans KR",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1720; --panel:#17212c; --ink:#e4eaf0; --muted:#94a3b3; --line:#2a3845;
  --accent:#5aa2ea; --open:#3cc58f; --soon:#f0a53a; --closed:#6f7c89; --unk:#a98be0;
  --bar:#223040; --mapbg:#121c26; --barfill:#1f6b52; --now:#ff6b5e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1720; --panel:#17212c; --ink:#e4eaf0; --muted:#94a3b3; --line:#2a3845;
  --accent:#5aa2ea; --open:#3cc58f; --soon:#f0a53a; --closed:#6f7c89; --unk:#a98be0;
  --bar:#223040; --mapbg:#121c26; --barfill:#1f6b52; --now:#ff6b5e; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
h1{margin:2px 0 0;font-size:24px;font-weight:700;text-wrap:balance}
.clock{text-align:right}
.clock .t{font-family:var(--f-mono);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.clock .d{font-size:13px;color:var(--muted)}
.notice{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--muted)}
.notice b{color:var(--accent)}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:640px){.summary{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:2px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.stat[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:-2px}
.stat .n{font-family:var(--f-mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input,.tools select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.tools input[type=search]{flex:1 1 180px;min-width:0}
.tools label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
button.btn{font:inherit;font-size:13px;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer}
button.btn:hover{border-color:var(--accent)}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{display:grid;gap:8px}
.row{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,var(--closed));border-radius:6px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr);gap:8px 20px;align-items:center}
@media (max-width:720px){.row{grid-template-columns:1fr}}
.name{font-weight:700;font-size:16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;color:var(--c);border:1px solid var(--c)}
.sample{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-weight:500}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px}
.tel{font-family:var(--f-mono);color:var(--ink);background:none;border:0;padding:0;cursor:pointer;font-size:13px}
.tel:hover{text-decoration:underline}
.hours{display:grid;gap:4px;min-width:0}
.hours .txt{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:8px}
.hours .txt span:last-child{color:var(--muted)}
.bar{position:relative;height:14px;background:var(--bar);border-radius:3px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;background:var(--barfill)}
.bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--now)}
.ticks{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.main{display:grid;gap:12px;align-items:start}
@media (min-width:960px){.main{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}.mapwrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}.main .row{grid-template-columns:1fr}}
.mapwrap{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:grid}
.maphead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}
.maphead b{font-size:14px}
.maphead .zm{display:flex;gap:4px}
.maphead .zm button{min-width:30px;height:28px;padding:0 8px;font-size:15px;line-height:1}
#map{position:relative;height:clamp(340px,62vh,640px);background:var(--mapbg);touch-action:none}
#map svg{width:100%;height:100%;display:block;cursor:grab}
#map svg.drag{cursor:grabbing}
.mk{cursor:pointer;stroke:var(--panel)}
.mk.sel{stroke:var(--ink)}
.dlab{fill:var(--muted);font-family:var(--f-body);pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.info{padding:10px 12px;border-top:1px solid var(--line);display:grid;gap:2px;font-size:13px}
.info .nm{font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row{cursor:pointer}
.nlink{color:var(--accent);font-size:13px;text-decoration:none;font-weight:500}
.nlink:hover{text-decoration:underline}
.row.sel{outline:2px solid var(--ink);outline-offset:-2px}
.leaflet-container{font-family:var(--f-body)}
.empty{padding:30px;text-align:center;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px}
details{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
summary{cursor:pointer;font-weight:700}
.data{display:grid;gap:10px;margin-top:10px;font-size:14px}
.data code,.url{font-family:var(--f-mono);font-size:12px}
.url{display:block;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;overflow-x:auto;white-space:nowrap}
textarea{width:100%;min-height:90px;font-family:var(--f-mono);font-size:12px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.msg{font-size:13px}
.msg.ok{color:var(--open)}.msg.err{color:var(--now)}
footer{font-size:12px;color:var(--muted)}
</style>
</head>

  </div>

  <footer>운영시간은 약국이 국립중앙의료원에 신고한 정보 기준이며 실제와 다를 수 있습니다. 방문 전 반드시 전화로 확인하세요. 공휴일 당번약국은 휴일지킴이약국(www.pharm114.or.kr)에서도 확인할 수 있습니다. · 마감임박: 종료 30분 전 · 1분마다 자동 갱신</footer>
</div>

let data=BASE, filter="all", simTime=null;

const toMin=s=>{s=String(s).padStart(4,"0");return +s.slice(0,2)*60+ +s.slice(2)};
const fmt=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const now=()=>simTime?new Date(simTime):new Date();
function dayKey(d,forceHol){ if(forceHol||HOLIDAYS.has(ymd(d))) return 8; const w=d.getDay(); return w===0?7:w; }
// 요일키에 대한 [open,close] 분 단위. close<=open이면 자정 넘김(+1440)
function span(p,k){const t=p.t&&p.t[k];if(!t||!t[0]||!t[1])return null;let o=toMin(t[0]),c=toMin(t[1]);if(c<=o)c+=1440;return[o,c]}

function status(p,d){
  const hol=$("#hol").checked, k=dayKey(d,hol), m=d.getHours()*60+d.getMinutes();
  const today=span(p,k);
  const y=new Date(d);y.setDate(y.getDate()-1);
  const prev=span(p,dayKey(y,false));
  const has=Object.keys(p.t||{}).length>0;
  let open=null;
  if(prev&&prev[1]>1440&&m<prev[1]-1440) open=[prev[0]-1440,prev[1]-1440];
  if(today&&m>=today[0]&&m<today[1]) open=today;
  let st;
  if(!has) st="unk";
  else if(open) st=(open[1]-m<=SOON)?"soon":"open";
  else if(k===8&&!today) st="closed";
  else st="closed";
  return{st,today,open,k,m};
}
const LABEL={open:"영업중",soon:"마감임박",closed:"영업종료",unk:"정보없음"};
const COLOR={open:"var(--open)",soon:"var(--soon)",closed:"var(--closed)",unk:"var(--unk)"};
const DAYN={1:"월",2:"화",3:"수",4:"목",5:"금",6:"토",7:"일",8:"공휴일"};

function dongOf(a){a=String(a||"");const m=a.match(/\(([^()]*)\)\s*$/);if(m){const f=m[1].split(",")[0].trim();if(/동$/.test(f))return f}return "동 미표기"}

var render=function(){

  $("#clkd").textContent=ymd(d)+" ("+"일월화수목금토"[d.getDay()]+")"+(k===8?" · 공휴일 기준":"")+(simTime?" · 지정시각":"");
  

  const rows=data.map((p,i)=>({p,i,s:status(p,d),dong:dongOf(p.addr)}));
  allRows=rows;
  const cnt={open:0,soon:0,closed:0,unk:0};rows.forEach(r=>cnt[r.s.st]++);
  const tiles=[["all","전체",rows.length,"var(--accent)"],["open","영업중",cnt.open,COLOR.open],["soon","마감임박",cnt.soon,COLOR.soon],["closed","영업종료",cnt.closed+cnt.unk,COLOR.closed]];
  $("#summary").innerHTML=tiles.map(([f,l,n,c])=>`<button class="stat" data-f="${f}" aria-pressed="${filter===f}"><span class="n">${n}</span><span class="l"><span class="dot" style="background:${c}"></span>${l}</span></button>`).join("");

  const sel=$("#dong"),cur=sel.value;

  const q=$("#q").value.trim();

  const vis=rows.filter(r=>(filter==="all"||(filter==="closed"?(r.s.st==="closed"||r.s.st==="unk"):r.s.st===filter))&&(!sel.value||r.dong===sel.value)&&(!q||(r.p.name+r.p.addr).includes(q)))
    .sort((a,b)=>order[a.s.st]-order[b.s.st]||a.p.name.localeCompare(b.p.name,"ko"));

  drawMap(vis);
  if(!vis.length){$("#list").innerHTML=`<div class="empty">조건에 맞는 약국이 없습니다.</div>`;return}
  const nowPct=(d.getHours()*60+d.getMinutes())/1440*100;
  $("#list").innerHTML=vis.map(({p,s,i})=>{
    const c=COLOR[s.st];
    let segs="",txt;

    else txt=Object.keys(p.t||{}).length?"오늘 휴무":"운영시간 미등록";
    if(s.open&&s.open[0]<0) segs+=`<i style="left:0;width:${s.open[1]/14.4}%"></i>`;
    let sub="";
    if(s.st==="open")sub=`${fmt(s.open[1])} 마감`;
    else if(s.st==="soon")sub=`${s.open[1]-s.m}분 후 마감`;
    else if(s.today&&s.m<s.today[0])sub=`${fmt(s.today[0])} 개점`;
    return `<article class="row${i===selIdx?" sel":""}" data-i="${i}" id="ph-${i}" style="--c:${c}">
      <div><div class="name">${esc(p.name)} <span class="pill">${LABEL[s.st]}</span>${p.sample?'<span class="sample">예시</span>':''}</div>
      <div class="meta"><span>${esc(p.addr||"")}</span>${p.tel?`<button class="tel" data-tel="${esc(p.tel)}" title="번호 복사">${esc(p.tel)}</button>`:""}<a class="nlink" href="${naverLink(p)}" target="_blank" rel="noopener">네이버 지도 ↗</a></div></div>
      <div class="hours"><div class="txt"><span>${DAYN[s.k]} ${txt}</span><span>${sub}</span></div>
      <div class="bar">${segs}<b style="left:${nowPct}%"></b></div>
      <div class="ticks"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div></div>
    </article>`}).join("");
}

  const miss=vis.length-pts.length;
  $("#mapNote").textContent=`${pts.length}곳`+(miss?` · 좌표 없음 ${miss}곳`:"");
  svgOn=false;if(NAVER_KEY&&!naverFail){if(window.naver&&naver.maps)drawNaver(pts);else $("#mapSrc").textContent="· 네이버 지도 불러오는 중"}else if(MAP_TILES&&window.L){drawLeaflet(pts)}else{svgOn=true;drawSvg(pts)}
  showInfo();
}
function initGeo(){
  const all=allRows.filter(r=>r.p.lat&&r.p.lon);if(!all.length)return false;
  let a=Infinity,b=-Infinity,c=Infinity,d=-Infinity;
  all.forEach(r=>{a=Math.min(a,+r.p.lon);b=Math.max(b,+r.p.lon);c=Math.min(c,+r.p.lat);d=Math.max(d,+r.p.lat)});
  const kx=Math.cos((c+d)/2*Math.PI/180);
  const w=(b-a)*kx||.01,h=(d-c)||.01,pad=44;
  const sc=Math.min((VW-2*pad)/w,(VH-2*pad)/h);
  const ox=(VW-w*sc)/2,oy=(VH-h*sc)/2;
  geo={p:(lat,lon)=>[ox+(lon-a)*kx*sc,oy+(d-lat)*sc],mPerUnit:111320/sc};
  return true;
}
function drawSvg(pts){
  if(!geo&&!initGeo()){$("#map").innerHTML="";return}
  if(!vb)vb=[0,0,VW,VH];
  $("#mapSrc").textContent="· 배경지도 없이 좌표 위치만 표시";
  const z=VW/vb[2];
  const g={};allRows.forEach(r=>{if(!r.p.lat||r.dong==="동 미표기")return;(g[r.dong]=g[r.dong]||[]).push(geo.p(r.p.lat,r.p.lon))});
  const placed=[];const labs=Object.entries(g).sort((p,q)=>q[1].length-p[1].length).map(([n,a])=>{const x=a.reduce((s,p)=>s+p[0],0)/a.length,y=a.reduce((s,p)=>s+p[1],0)/a.length;if(placed.some(([px,py])=>Math.abs(px-x)*z<44&&Math.abs(py-y)*z<16))return "";placed.push([x,y]);return `<text class="dlab" x="${x+12/z}" y="${y-12/z}" style="font-size:${12/z}px">${esc(n)}</text>`}).join("");
  const order={closed:0,unk:0,soon:1,open:2};
  const mks=pts.slice().sort((x,y)=>order[x.s.st]-order[y.s.st]||(x.i===selIdx)-(y.i===selIdx)).map(r=>{const[x,y]=geo.p(r.p.lat,r.p.lon);const on=r.i===selIdx;return `<circle class="mk${on?" sel":""}" data-i="${r.i}" cx="${x}" cy="${y}" r="${(on?10:7)/z}" style="fill:${COLOR[r.s.st]};stroke-width:${(on?3:2)/z}px"><title>${esc(r.p.name)} · ${LABEL[r.s.st]}</title></circle>`}).join("");
  const km=1000/geo.mPerUnit, sbx=vb[0]+14/z, sby=vb[1]+vb[3]-16/z;
  const scale=`<g style="pointer-events:none"><line x1="${sbx}" y1="${sby}" x2="${sbx+km}" y2="${sby}" style="stroke:var(--ink);stroke-width:${2/z}px"/><text x="${sbx}" y="${sby-6/z}" style="font-size:${11/z}px;fill:var(--muted)">1 km</text><text x="${vb[0]+vb[2]-18/z}" y="${vb[1]+22/z}" text-anchor="middle" style="font-size:${13/z}px;fill:var(--muted);font-weight:700">N ↑</text></g>`;
  $("#map").innerHTML=`<svg viewBox="${vb.join(" ")}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="약국 위치도">${labs}${mks}${scale}</svg>`;
}
function zoom(f,cx,cy){
  if(nmap){nmap.setZoom(nmap.getZoom()+(f>1?1:-1));return}
  if(lmap){f>1?lmap.zoomIn():lmap.zoomOut();return}
  if(!vb)return;cx=cx??vb[0]+vb[2]/2;cy=cy??vb[1]+vb[3]/2;
  const w=Math.min(VW*1.2,Math.max(VW/14,vb[2]/f)),h=w*VH/VW;
  vb=[cx-(cx-vb[0])*w/vb[2],cy-(cy-vb[1])*h/vb[3],w,h];render();
}
function drawNaver(pts){
  $("#mapSrc").textContent="";
  if(!nmap){$("#map").innerHTML="";nmap=new naver.maps.Map("map",{zoomControl:false,scaleControl:true,mapDataControl:false})}
  nmarkers.forEach(m=>m.setMap(null));
  nmarkers=pts.map(r=>{const on=r.i===selIdx,sz=on?20:16;
    const m=new naver.maps.Marker({position:new naver.maps.LatLng(r.p.lat,r.p.lon),map:nmap,title:r.p.name+" · "+LABEL[r.s.st],zIndex:on?200:(r.s.st==="open"?100:r.s.st==="soon"?150:50),
      icon:{content:`<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${tok(STV[r.s.st])};border:${on?3:2}px solid ${on?"#15202b":"#fff"};box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer"></div>`,anchor:new naver.maps.Point(sz/2,sz/2)}});
    naver.maps.Event.addListener(m,"click",()=>select(r.i,true));return m});
  if(!nfitted){const all=allRows.filter(r=>r.p.lat);if(all.length){const b=new naver.maps.LatLngBounds();all.forEach(r=>b.extend(new naver.maps.LatLng(r.p.lat,r.p.lon)));nmap.fitBounds(b,{top:24,right:24,bottom:24,left:24});nfitted=true}}
}
function drawLeaflet(pts){
  $("#mapSrc").textContent="";
  if(!lmap){lmap=L.map("map",{zoomControl:false});L.tileLayer(MAP_TILES,{minZoom:6,maxZoom:19,attribution:MAP_ATTR}).addTo(lmap);lmarkers=L.layerGroup().addTo(lmap)}
  lmarkers.clearLayers();
  pts.forEach(r=>{const on=r.i===selIdx;const m=L.circleMarker([r.p.lat,r.p.lon],{radius:on?10:8,weight:on?3:2,color:on?tok("--ink"):"#ffffff",fillColor:tok(STV[r.s.st]),fillOpacity:1});
    m.bindTooltip(`${esc(r.p.name)} · ${LABEL[r.s.st]}`);m.on("click",()=>select(r.i,true));lmarkers.addLayer(m)});
  if(!lfitted){const all=allRows.filter(r=>r.p.lat);if(all.length){lmap.fitBounds(all.map(r=>[r.p.lat,r.p.lon]),{padding:[24,24]});lfitted=true}}
}
(function(){
  const m=$("#map");let drag=null,moved=false;
  const unit=()=>{const r=m.getBoundingClientRect();return Math.max(vb[2]/r.width,vb[3]/r.height)};
  m.addEventListener("click",e=>{if(moved){moved=false;return}const c=e.target.closest(".mk");if(c)select(+c.dataset.i,true)});
  m.addEventListener("wheel",e=>{if(!svgOn||!vb)return;e.preventDefault();const r=m.getBoundingClientRect(),k=unit();
    const cx=vb[0]+vb[2]/2+(e.clientX-r.left-r.width/2)*k,cy=vb[1]+vb[3]/2+(e.clientY-r.top-r.height/2)*k;zoom(e.deltaY<0?1.3:1/1.3,cx,cy)},{passive:false});
  m.addEventListener("pointerdown",e=>{if(!svgOn||!vb)return;drag={x:e.clientX,y:e.clientY,v:vb.slice(),k:unit()};moved=false});
  m.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!moved&&Math.hypot(dx,dy)<4)return;
    if(!moved){moved=true;try{m.setPointerCapture(e.pointerId)}catch(_){}}
    vb=[drag.v[0]-dx*drag.k,drag.v[1]-dy*drag.k,drag.v[2],drag.v[3]];render();m.querySelector("svg")?.classList.add("drag")});
  const up=()=>{drag=null;m.querySelector("svg")?.classList.remove("drag")};m.addEventListener("pointerup",up);m.addEventListener("pointercancel",up);
  $("#zin").onclick=()=>zoom(1.6);$("#zout").onclick=()=>zoom(1/1.6);
  $("#zfit").onclick=()=>{selIdx=null;if(nmap){nfitted=false;render();return}if(lmap){lfitted=false;render();return}vb=[0,0,VW,VH];render()};
})();
document.addEventListener("click",e=>{
  const st=e.target.closest(".stat");if(st){filter=st.dataset.f;render();return}
  const row=e.target.closest(".row");if(row&&!e.target.closest(".tel,a")){select(+row.dataset.i,false);return}
  const tel=e.target.closest(".tel");if(tel){navigator.clipboard?.writeText(tel.dataset.tel).then(()=>{tel.textContent="복사됨";setTimeout(render,900)}).catch(()=>{});}
});
$("#q").oninput=render;$("#dong").onchange=render;$("#hol").onchange=render;
$("#sim").onchange=e=>{simTime=e.target.value?new Date(e.target.value).getTime():null;render()};
$("#now").onclick=()=>{simTime=null;$("#sim").value="";render()};
let meta=null;
function showSrc(){
  if(meta){$("#srcT").textContent="자동 갱신";$("#srcD").textContent=`국립중앙의료원 약국 정보 조회 서비스 · ${meta} 기준 (동해시 ${data.length}곳)`}
  else{$("#srcT").textContent="기본 데이터";$("#srcD").textContent=`국립중앙의료원 약국 정보 조회 서비스, ${BASE_DATE} 기준 (동해시 ${BASE.length}곳)`}
}
const _render=render;render=function(){_render();showSrc()};
// 서버의 pharmacy.json(update_pharmacy.py가 매일 생성)을 읽고, 실패하면 내장 데이터로 표시
async function fetchData(){try{const r=await fetch("pharmacy.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const j=await r.json();
  if(Array.isArray(j.items)&&j.items.length){data=j.items;meta=String(j.updated||"");render()}}catch(e){}}
render();fetchData();setInterval(fetchData,3600000);setInterval(()=>{if(!simTime)render()},60000);
</script>
