<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<title>동해시 의료기관 운영현황</title>
<style>
/* 상단 요약 → 탭(약국/병·의원/응급실) → 지도 + 목록 */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#15202b; --muted:#5b6b7a; --line:#d5dce3;
  --accent:#0b5cad; --open:#12805c; --soon:#b86e00; --closed:#8a94a0; --danger:#c62f2f;
  --bar:#e3e8ee; --barfill:#9fd3bd; --now:#d23b2f; --mapbg:#e6ecf1;
  --f-body:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Consolas,"D2Coding",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1720; --panel:#17212c; --ink:#e4eaf0; --muted:#94a3b3; --line:#2a3845;
  --accent:#5aa2ea; --open:#3cc58f; --soon:#f0a53a; --closed:#6f7c89; --danger:#ff6b5e;
  --bar:#223040; --barfill:#1f6b52; --now:#ff6b5e; --mapbg:#121c26; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1720; --panel:#17212c; --ink:#e4eaf0; --muted:#94a3b3; --line:#2a3845;
  --accent:#5aa2ea; --open:#3cc58f; --soon:#f0a53a; --closed:#6f7c89; --danger:#ff6b5e;
  --bar:#223040; --barfill:#1f6b52; --now:#ff6b5e; --mapbg:#121c26; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
h1{margin:2px 0 0;font-size:24px;font-weight:700;text-wrap:balance}
.clock{text-align:right}
.clock .t{font-family:var(--f-mono);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.clock .d{font-size:13px;color:var(--muted)}
.notice{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-size:15px;font-weight:600;background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab svg{width:18px;height:18px}
.tab .c{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:640px){.summary{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:grid;gap:2px;text-align:left;font:inherit;color:inherit}
button.stat{cursor:pointer}
.stat[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:-2px}
.stat .n{font-family:var(--f-mono);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input,.tools select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);min-width:0}
.tools input[type=search]{flex:1 1 180px}
.tools label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.btn{font:inherit;font-size:13px;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.main{display:grid;gap:12px;align-items:start}
@media (min-width:980px){.main{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}.mapwrap{position:sticky;top:12px}}
.mapwrap{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:grid}
.maphead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}
.layers{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:4px 10px;cursor:pointer;display:flex;align-items:center;gap:5px}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);font-weight:600}
.chip svg{width:14px;height:14px}
#map{height:clamp(360px,64vh,680px);background:var(--mapbg)}
.mapmsg{display:grid;place-items:center;height:100%;color:var(--muted);font-size:14px;padding:20px;text-align:center}
.info{padding:10px 12px;border-top:1px solid var(--line);display:grid;gap:3px;font-size:13px}
.info .nm{font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.list{display:grid;gap:8px;min-width:0}
.row{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,var(--closed));border-radius:6px;padding:12px 14px;display:grid;gap:6px;cursor:pointer}
.row.sel{outline:2px solid var(--ink);outline-offset:-2px}
.name{font-weight:700;font-size:16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.name svg{width:18px;height:18px;color:var(--muted);flex:none}
.pill{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;color:var(--c);border:1px solid var(--c);white-space:nowrap}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;font-weight:500}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.tel{font-family:var(--f-mono);color:var(--ink);background:none;border:0;padding:0;cursor:pointer;font-size:13px}
.nlink{color:var(--accent);font-size:13px;text-decoration:none;font-weight:500}
.nlink:hover,.tel:hover{text-decoration:underline}
.hours .txt{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:8px}
.hours .txt span:last-child{color:var(--muted)}
.bar{position:relative;height:12px;background:var(--bar);border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{position:absolute;top:0;bottom:0;background:var(--barfill)}
.bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--now)}
.ticks{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.depts{font-size:12px;color:var(--muted)}
.beds{display:grid;grid-template-columns:minmax(110px,auto) repeat(3,minmax(0,1fr));gap:8px 16px;align-items:end}
@media (max-width:480px){.beds{grid-template-columns:repeat(3,minmax(0,1fr))}.beds .big{grid-column:1/-1}}
.bed{display:grid;gap:0}
.bed .v{font-family:var(--f-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.bed .k{font-size:12px;color:var(--muted)}
.big .v{font-size:34px;color:var(--c)}
.big .v small{font-size:14px;color:var(--muted);font-weight:500}
.equip{display:flex;flex-wrap:wrap;gap:4px}
.eq{font-size:12px;border-radius:4px;padding:0 6px;border:1px solid var(--line);color:var(--muted)}
.eq.y{color:var(--open);border-color:var(--open)}
.warn{font-size:12px;color:var(--danger);font-weight:600}
.empty{padding:30px;text-align:center;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px}
footer{font-size:12px;color:var(--muted);line-height:1.6}
/* 지도 핀 */
.pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.pin svg{transform:rotate(45deg);width:19px;height:19px;color:#fff}
.pin.sel{border-color:#15202b;border-width:3px;transform:rotate(-45deg) scale(1.2)}
.pinwrap{position:relative;width:34px;height:34px}
.badge{position:absolute;top:-8px;right:-12px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#fff;color:#15202b;border:2px solid currentColor;font:700 13px/18px var(--f-mono);text-align:center}
.leaflet-div-icon{background:none;border:0}
.leaflet-container{font-family:var(--f-body)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">동해시 · 실시간 의료기관 안내</div>
      <h1>지금 문 연 약국·병원</h1>
    </div>
    <div class="clock"><div class="t" id="clk">--:--</div><div class="d" id="clkd"></div></div>
  </header>

  <div class="notice" id="src">데이터를 불러오는 중입니다.</div>

  <nav class="tabs" role="tablist" aria-label="기관 종류">
    <button class="tab" role="tab" data-t="ph" aria-selected="true"><span data-ic="ph"></span>약국 <span class="c" id="c-ph"></span></button>
    <button class="tab" role="tab" data-t="hp" aria-selected="false"><span data-ic="hp"></span>병·의원 <span class="c" id="c-hp"></span></button>
    <button class="tab" role="tab" data-t="er" aria-selected="false"><span data-ic="er"></span>응급실 <span class="c" id="c-er"></span></button>
  </nav>

  <section class="summary" id="summary"></section>

  <div class="tools" id="tools">
    <input type="search" id="q" placeholder="이름·주소 검색">
    <select id="dong" aria-label="행정동"></select>
    <select id="div" aria-label="종별"></select>
    <select id="dept" aria-label="진료과목"></select>
    <label><input type="checkbox" id="hol"> 공휴일로 판정</label>
    <label>기준시각 <input type="datetime-local" id="sim"></label>
    <button class="btn" id="now">현재시각</button>
  </div>

  <div class="main">
    <section class="mapwrap" aria-label="위치 지도">
      <div class="maphead">
        <div class="layers" id="layers">
          <button class="chip" data-l="ph" aria-pressed="true"><span data-ic="ph"></span>약국</button>
          <button class="chip" data-l="hp" aria-pressed="false"><span data-ic="hp"></span>병·의원</button>
          <button class="chip" data-l="er" aria-pressed="true"><span data-ic="er"></span>응급실</button>
        </div>
        <button class="btn" id="zfit" style="padding:4px 10px;font-size:12px">전체 보기</button>
      </div>
      <div id="map"></div>
      <div class="info" id="info" hidden></div>
      <div class="legend" id="legend"></div>
    </section>
    <section class="list" id="list"></section>
  </div>

  <footer>
    운영시간·가용병상은 각 기관이 국립중앙의료원(E-Gen)에 입력한 정보로, 실제와 다를 수 있습니다. 방문 전 반드시 전화로 확인하세요.<br>
    응급실 가용병상은 10분 간격으로 갱신되며 병원이 입력한 시각 기준입니다. 응급 상황에서는 119에 먼저 신고하세요.<br>
    공휴일 당번약국: 휴일지킴이약국(www.pharm114.or.kr) · 출처: 국립중앙의료원 약국·병의원·응급의료기관 정보 조회 서비스(공공데이터포털) · 지도: 국토교통부 브이월드
  </footer>
</div>

<script>
// ===== 설정 =====
// 배경지도: 브이월드 (vworld.kr 인증키, 서비스 URL 등록 필요)
const MAP_TILES="https://api.vworld.kr/req/wmts/1.0.0/9D9CE6E6-E4E5-4D9B-82AA-319C6F178AA3/Base/{z}/{y}/{x}.png", MAP_ATTR="&copy; 국토교통부 브이월드";
// const MAP_TILES="https://tile.openstreetmap.org/{z}/{x}/{y}.png", MAP_ATTR='&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
const SOON=30;           // 마감임박 기준(분)
const ER_WARN=2;         // 응급실 가용병상 이 수 이하면 주황
// 공휴일(대체공휴일 포함). 매년 말 다음 해 추가 필요. 누락 시 '공휴일로 판정' 체크로 수동 처리
const HOLIDAYS=new Set(["2026-01-01","2026-02-16","2026-02-17","2026-02-18","2026-03-01","2026-03-02","2026-05-05","2026-05-24","2026-05-25","2026-06-03","2026-06-06","2026-08-15","2026-08-17","2026-09-24","2026-09-25","2026-09-26","2026-10-03","2026-10-05","2026-10-09","2026-12-25",
 "2027-01-01","2027-02-06","2027-02-07","2027-02-08","2027-02-09","2027-03-01","2027-05-05","2027-05-13","2027-06-06","2027-08-15","2027-08-16","2027-09-14","2027-09-15","2027-09-16","2027-10-03","2027-10-04","2027-10-09","2027-10-11","2027-12-25","2027-12-27"]);

// ===== 아이콘 (Tabler Icons, MIT) =====
const P=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d.map(x=>`<path d="${x}"/>`).join("")}</svg>`;
const IC={
  ph:P(["M4.5 12.5l8 -8a4.94 4.94 0 0 1 7 7l-8 8a4.94 4.94 0 0 1 -7 -7","M8.5 8.5l7 7"]),
  hp:P(["M3 21l18 0","M5 21v-16a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v16","M9 21v-4a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v4","M10 9l4 0","M12 7l0 4"]),
  dt:P(["M12 5.5c-1.074 -.586 -2.583 -1.5 -4 -1.5c-2.1 0 -4 1.247 -4 5c0 4.899 1.056 8.41 2.671 10.537c.573 .756 1.97 .521 2.567 -.236c.398 -.505 .819 -1.439 1.262 -2.801c.292 -.771 .892 -1.504 1.5 -1.5c.602 0 1.21 .737 1.5 1.5c.443 1.362 .864 2.295 1.262 2.8c.597 .759 2 .993 2.567 .237c1.615 -2.127 2.671 -5.637 2.671 -10.537c0 -3.74 -1.908 -5 -4 -5c-1.423 0 -2.92 .911 -4 1.5","M12 5.5l3 1.5"]),
  km:P(["M5 21c.5 -4.5 2.5 -8 7 -10","M9 18c6.218 0 10.5 -3.288 11 -12v-2h-4.014c-9 0 -11.986 4 -12 9c0 1 0 3 2 5h3l.014 0"]),
  er:P(["M5 17a2 2 0 1 0 4 0a2 2 0 1 0 -4 0","M15 17a2 2 0 1 0 4 0a2 2 0 1 0 -4 0","M5 17h-2v-11a1 1 0 0 1 1 -1h9v12m-4 0h6m4 0h2v-6h-8m0 -5h5l3 5","M6 10h4m-2 -2v4"])
};
document.querySelectorAll("[data-ic]").forEach(e=>e.outerHTML=IC[e.dataset.ic]);
const hpIcon=p=>/치과/.test(p.div)?"dt":/한의원|한방/.test(p.div)?"km":"hp";

// ===== 공통 =====
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tok=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const toMin=s=>{s=String(s).padStart(4,"0");return +s.slice(0,2)*60+ +s.slice(2)};
const fmt=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
let simTime=null;const now=()=>simTime?new Date(simTime):new Date();
const dayKey=(d,force)=>force||HOLIDAYS.has(ymd(d))?8:(d.getDay()||7);
function span(p,k){const t=p.t&&p.t[k];if(!t||!t[0]||!t[1])return null;let o=toMin(t[0]),c=toMin(t[1]);if(c<=o)c+=1440;return[o,c]}
function status(p,d){
  const k=dayKey(d,$("#hol").checked),m=d.getHours()*60+d.getMinutes(),today=span(p,k);
  const y=new Date(d);y.setDate(y.getDate()-1);const prev=span(p,dayKey(y,false));
  let open=null;
  if(prev&&prev[1]>1440&&m<prev[1]-1440)open=[prev[0]-1440,prev[1]-1440];
  if(today&&m>=today[0]&&m<today[1])open=today;
  const st=!Object.keys(p.t||{}).length?"unk":open?(open[1]-m<=SOON?"soon":"open"):"closed";
  return{st,today,open,k,m};
}
const DAYN={1:"월",2:"화",3:"수",4:"목",5:"금",6:"토",7:"일",8:"공휴일"};
const COL={open:"var(--open)",soon:"var(--soon)",closed:"var(--closed)",unk:"var(--closed)",ok:"var(--open)",low:"var(--soon)",none:"var(--danger)"};
const CV={open:"--open",soon:"--soon",closed:"--closed",unk:"--closed",ok:"--open",low:"--soon",none:"--danger"};
const LAB={ph:{open:"영업중",soon:"마감임박",closed:"영업종료",unk:"정보없음"},hp:{open:"진료중",soon:"마감임박",closed:"진료종료",unk:"정보없음"}};
const dongOf=a=>{const m=String(a||"").match(/\(([^()]*)\)\s*$/);if(m){const f=m[1].split(",")[0].trim();if(/동$/.test(f))return f}return "동 미표기"};
const naver=p=>"https://map.naver.com/p/search/"+encodeURIComponent((p.city||"동해시")+" "+p.name);
const erState=h=>{const v=h.b&&h.b.hvec;return v==null?"unk":v<=0?"none":v<=ER_WARN?"low":"ok"};
const erTime=s=>s&&s.length>=12?`${+s.slice(4,6)}/${+s.slice(6,8)} ${s.slice(8,10)}:${s.slice(10,12)}`:"";
const TYPES={ph:"약국",hp:"병·의원",er:"응급실"};

// ===== 데이터 =====
const DATA={ph:[],hp:[],er:[]},UPD={};
const FILES={ph:"pharmacy.json",hp:"hospital.json",er:"er.json"};
async function load(t){try{const r=await fetch(FILES[t]+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const j=await r.json();
  if(Array.isArray(j.items)){DATA[t]=j.items.map((p,i)=>Object.assign(p,{_t:t,_k:t+i}));UPD[t]=j.updated||"";fitted=false;}}catch(e){}}
async function loadAll(){await Promise.all(["ph","hp","er"].map(load));initFilters();render()}
async function loadER(){await load("er");render()}

// ===== 상태 =====
let tab="ph",filter="all",selKey=null;
const layers={ph:true,hp:false,er:true};

function rowsOf(t,d){return DATA[t].map(p=>({p,t,s:t==="er"?{st:erState(p)}:status(p,d),dong:dongOf(p.addr)}))}
function visible(t,d){
  const q=$("#q").value.trim(),dg=$("#dong").value,dv=$("#div").value,dp=$("#dept").value;
  return rowsOf(t,d).filter(r=>{
    if(t!==tab)return true;
    if(t!=="er"&&filter!=="all"&&(filter==="closed"?!(r.s.st==="closed"||r.s.st==="unk"):r.s.st!==filter))return false;
    if(t==="er"&&filter!=="all"&&r.s.st!==filter)return false;
    if(q&&!(r.p.name+r.p.addr).includes(q))return false;
    if(t!=="er"&&dg&&r.dong!==dg)return false;
    if(t==="hp"&&dv&&r.p.div!==dv)return false;
    if(t==="hp"&&dp&&!(r.p.d||[]).includes(dp))return false;
    return true;
  });
}

function initFilters(){
  const opt=(el,first,vals)=>{const cur=el.value;el.innerHTML=`<option value="">${first}</option>`+vals.map(v=>`<option${v===cur?" selected":""}>${esc(v)}</option>`).join("")};
  const cnt=a=>{const c={};a.forEach(x=>c[x]=(c[x]||0)+1);return Object.keys(c).sort((a,b)=>c[b]-c[a]||a.localeCompare(b,"ko"))};
  opt($("#div"),"전체 종별",cnt(DATA.hp.map(p=>p.div).filter(Boolean)));
  opt($("#dept"),"전체 진료과목",cnt(DATA.hp.flatMap(p=>p.d||[])));
}

function render(){
  const d=now();
  $("#clk").textContent=fmt(d.getHours()*60+d.getMinutes());
  const k=dayKey(d,$("#hol").checked);
  $("#clkd").textContent=ymd(d)+" ("+"일월화수목금토"[d.getDay()]+")"+(k===8?" · 공휴일 기준":"")+(simTime?" · 지정시각":"");
  const parts=[];if(UPD.ph)parts.push(`약국 ${UPD.ph}`);if(UPD.hp)parts.push(`병·의원 ${UPD.hp}`);if(UPD.er)parts.push(`응급실 ${UPD.er.slice(5)}`);
  $("#src").textContent=parts.length?"자동 갱신 기준 — "+parts.join(" · "):"데이터를 불러오지 못했습니다. 잠시 후 새로고침하세요.";
  ["ph","hp","er"].forEach(t=>$("#c-"+t).textContent=DATA[t].length||"");

  // 탭별 필터 표시
  const isER=tab==="er";
  $("#dong").hidden=isER;$("#hol").parentElement.hidden=isER;$("#sim").parentElement.hidden=isER;$("#now").hidden=isER;
  $("#div").hidden=tab!=="hp";$("#dept").hidden=tab!=="hp";
  const dsel=$("#dong"),dcur=dsel.value,dongs=[...new Set(DATA[tab].map(p=>dongOf(p.addr)))].sort();
  dsel.innerHTML=`<option value="">전체 동</option>`+dongs.map(x=>`<option${x===dcur?" selected":""}>${esc(x)}</option>`).join("");

  // 요약
  const all=rowsOf(tab,d),c={};all.forEach(r=>c[r.s.st]=(c[r.s.st]||0)+1);
  let tiles;
  if(isER){const sum=DATA.er.reduce((a,h)=>a+Math.max(0,(h.b&&h.b.hvec)||0),0);
    tiles=[["all","응급실",all.length,"var(--accent)"],["ok","가용병상 합계",sum,COL.ok],["low",`여유 적음(${ER_WARN} 이하)`,c.low||0,COL.low],["none","포화(0 이하)",c.none||0,COL.none]];}
  else{const L=LAB[tab];tiles=[["all","전체",all.length,"var(--accent)"],["open",L.open,c.open||0,COL.open],["soon",L.soon,c.soon||0,COL.soon],["closed",L.closed,(c.closed||0)+(c.unk||0),COL.closed]];}
  $("#summary").innerHTML=tiles.map(([f,l,n,col])=>(isER&&f==="ok")?
    `<div class="stat"><span class="n">${n}</span><span class="l"><span class="dot" style="background:${col}"></span>${l}</span></div>`:
    `<button class="stat" data-f="${f}" aria-pressed="${filter===f}"><span class="n">${n}</span><span class="l"><span class="dot" style="background:${col}"></span>${l}</span></button>`).join("");

  // 범례
  $("#legend").innerHTML=isER?`<span><i class="dot" style="background:var(--open)"></i>가용 ${ER_WARN+1}+</span><span><i class="dot" style="background:var(--soon)"></i>1~${ER_WARN}</span><span><i class="dot" style="background:var(--danger)"></i>0 이하(포화)</span><span>핀 숫자 = 응급실 가용병상</span>`
    :`<span><i class="dot" style="background:var(--open)"></i>${LAB[tab].open}</span><span><i class="dot" style="background:var(--soon)"></i>마감임박</span><span><i class="dot" style="background:var(--closed)"></i>종료</span>`;

  // 목록
  const order={open:0,soon:1,closed:2,unk:3,ok:0,low:1,none:2};
  const vis=visible(tab,d).sort((a,b)=>isER?0:order[a.s.st]-order[b.s.st]||a.p.name.localeCompare(b.p.name,"ko"));
  $("#list").innerHTML=vis.length?vis.map(r=>isER?erRow(r):row(r,d)).join(""):`<div class="empty">${DATA[tab].length?"조건에 맞는 곳이 없습니다.":"데이터를 불러오는 중이거나 아직 없습니다."}</div>`;

  drawMap(d);showInfo(d);
}

function hoursHtml(r,d){
  const s=r.s,p=r.p;let segs="",txt;
  if(s.today){const[o,c]=s.today;segs+=`<i style="left:${o/14.4}%;width:${(Math.min(c,1440)-o)/14.4}%"></i>`;txt=(o===0&&c>=1440)?"24시간":`${fmt(o)} – ${fmt(c)}${c>1440?" (익일)":""}`}
  else txt=Object.keys(p.t||{}).length?"오늘 휴무":"운영시간 미등록";
  if(s.open&&s.open[0]<0)segs+=`<i style="left:0;width:${s.open[1]/14.4}%"></i>`;
  let sub="";if(s.today&&s.today[0]===0&&s.today[1]>=1440)sub="";else if(s.st==="open")sub=`${fmt(s.open[1])} 마감`;else if(s.st==="soon")sub=`${s.open[1]-s.m}분 후 마감`;else if(s.today&&s.m<s.today[0])sub=`${fmt(s.today[0])} 시작`;
  const nowPct=(d.getHours()*60+d.getMinutes())/14.4;
  return `<div class="hours"><div class="txt"><span>${DAYN[s.k]} ${txt}</span><span>${sub}</span></div><div class="bar">${segs}<b style="left:${nowPct}%"></b></div><div class="ticks"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div></div>`;
}
function row(r,d){
  const p=r.p,t=r.t,ic=t==="ph"?IC.ph:IC[hpIcon(p)];
  const tags=t==="hp"?`<span class="tag">${esc(p.div)}</span>${p.er?'<span class="tag">응급실 운영</span>':""}`:"";
  const dep=t==="hp"&&p.d&&p.d.length?`<div class="depts">진료과목: ${esc(p.d.join(", "))}</div>`:"";
  const inf=p.inf?`<div class="depts">${esc(p.inf)}</div>`:"";
  return `<article class="row${p._k===selKey?" sel":""}" data-k="${p._k}" style="--c:${COL[r.s.st]}">
    <div class="name">${ic}${esc(p.name)} <span class="pill">${LAB[t][r.s.st]}</span>${tags}</div>
    <div class="meta"><span>${esc(p.addr)}</span>${p.tel?`<button class="tel" data-tel="${esc(p.tel)}" title="번호 복사">${esc(p.tel)}</button>`:""}<a class="nlink" href="${naver(p)}" target="_blank" rel="noopener">네이버 지도 ↗</a></div>
    ${hoursHtml(r,d)}${dep}${inf}</article>`;
}
function erNum(v){if(v==null)return "–";return v<0?`0`:String(v)}
function erRow(r){
  const h=r.p,b=h.b||{},col=COL[r.s.st];
  const over=b.hvec<0?`<div class="warn">과밀 +${-b.hvec} (병상보다 환자 많음)</div>`:"";
  const eq=[["hvctayn","CT"],["hvmriayn","MRI"],["hvangioayn","혈관조영"],["hvventiayn","인공호흡기"],["hvamyn","구급차"]].filter(([k])=>b[k]).map(([k,n])=>`<span class="eq${b[k]==="Y"?" y":""}">${n} ${b[k]==="Y"?"가능":"불가"}</span>`).join("");
  return `<article class="row${h._k===selKey?" sel":""}" data-k="${h._k}" style="--c:${col}">
    <div class="name">${IC.er}${esc(h.name)} <span class="tag">${esc(h.city||"")}</span>${h.cls?`<span class="tag">${esc(h.cls)}</span>`:""}</div>
    <div class="beds">
      <div class="bed big"><span class="v">${erNum(b.hvec)}${b.hvs01!=null?` <small>/ ${b.hvs01}</small>`:""}</span><span class="k">응급실 가용</span></div>
      <div class="bed"><span class="v">${erNum(b.hvicc)}</span><span class="k">중환자실</span></div>
      <div class="bed"><span class="v">${erNum(b.hvgc)}</span><span class="k">입원실</span></div>
      <div class="bed"><span class="v">${erNum(b.hvoc)}</span><span class="k">수술실</span></div>
    </div>${over}
    ${eq?`<div class="equip">${eq}</div>`:""}
    <div class="meta"><span>병원 입력 ${esc(erTime(b.hvidate))}</span>${h.tel?`<button class="tel" data-tel="${esc(h.tel)}" title="번호 복사">${esc(h.tel)}</button>`:""}<a class="nlink" href="${naver(h)}" target="_blank" rel="noopener">네이버 지도 ↗</a></div>
  </article>`;
}

function findSel(d){if(!selKey)return null;const t=selKey.slice(0,2);return rowsOf(t,d).find(r=>r.p._k===selKey)||null}
function showInfo(d){
  const box=$("#info"),r=findSel(d);if(!r){box.hidden=true;return}
  box.hidden=false;const p=r.p;
  if(r.t==="er"){const b=p.b||{};box.innerHTML=`<div class="nm">${esc(p.name)} <span class="pill" style="--c:${COL[r.s.st]}">응급실 가용 ${erNum(b.hvec)}${b.hvs01!=null?" / "+b.hvs01:""}</span></div><div>중환자실 ${erNum(b.hvicc)} · 입원실 ${erNum(b.hvgc)} · 수술실 ${erNum(b.hvoc)} · 입력 ${esc(erTime(b.hvidate))}</div><div class="meta">${p.tel?`<button class="tel" data-tel="${esc(p.tel)}">${esc(p.tel)}</button>`:""}<a class="nlink" href="${naver(p)}" target="_blank" rel="noopener">네이버 지도에서 보기 ↗</a></div>`;return}
  const s=r.s,ht=s.today?(s.today[0]===0&&s.today[1]>=1440?`${DAYN[s.k]} 24시간`:`${DAYN[s.k]} ${fmt(s.today[0])}–${fmt(s.today[1])}`):"오늘 휴무/미등록";
  box.innerHTML=`<div class="nm">${esc(p.name)} <span class="pill" style="--c:${COL[s.st]}">${LAB[r.t][s.st]}</span>${p.div?`<span class="tag">${esc(p.div)}</span>`:""}</div><div>${esc(ht)}${p.inf?" · "+esc(p.inf):""}</div><div style="color:var(--muted)">${esc(p.addr)}</div><div class="meta">${p.tel?`<button class="tel" data-tel="${esc(p.tel)}">${esc(p.tel)}</button>`:""}<a class="nlink" href="${naver(p)}" target="_blank" rel="noopener">네이버 지도에서 보기 ↗</a></div>`;
}

// ===== 지도 =====
let lmap=null,lgroup=null,fitted=false;
function pinHtml(ic,color,sel,badge){return `<div class="pinwrap"><div class="pin${sel?" sel":""}" style="background:${color}">${ic}</div>${badge!=null?`<div class="badge" style="color:${color}">${badge}</div>`:""}</div>`}
function drawMap(d){
  if(!window.L){$("#map").innerHTML=`<div class="mapmsg">지도를 불러오지 못했습니다. 인터넷 연결을 확인하세요.</div>`;return}
  if(!lmap){lmap=L.map("map",{zoomControl:true});L.tileLayer(MAP_TILES,{minZoom:6,maxZoom:19,attribution:MAP_ATTR}).addTo(lmap);lgroup=L.layerGroup().addTo(lmap);lmap.setView([37.52,129.11],13)}
  lgroup.clearLayers();
  const pts=[];
  ["hp","ph","er"].forEach(t=>{
    if(!(layers[t]||t===tab))return;
    visible(t,d).forEach(r=>{const p=r.p;if(!p.lat||!p.lon)return;
      const sel=p._k===selKey,color=tok(CV[r.s.st])||"#888";
      const ic=t==="ph"?IC.ph:t==="er"?IC.er:IC[hpIcon(p)];
      const badge=t==="er"?erNum(p.b&&p.b.hvec):null;
      const m=L.marker([p.lat,p.lon],{icon:L.divIcon({html:pinHtml(ic,color,sel,badge),className:"",iconSize:[34,34],iconAnchor:[17,41]}),
        zIndexOffset:sel?1000:t==="er"?500:t===tab?200:0,title:`${p.name} · ${t==="er"?"응급실 가용 "+badge:LAB[t][r.s.st]}`});
      m.on("click",()=>select(p._k,true));lgroup.addLayer(m);if(t===tab)pts.push([p.lat,p.lon]);
    });
  });
  if(!fitted&&pts.length){lmap.fitBounds(pts,{padding:[30,30],maxZoom:15});fitted=true}
}
function select(k,fromMap){
  selKey=selKey===k?null:k;
  if(selKey&&!fromMap&&lmap){const r=findSel(now());if(r&&r.p.lat)lmap.setView([r.p.lat,r.p.lon],Math.max(lmap.getZoom(),16))}
  render();
  if(selKey&&fromMap){const el=document.querySelector(`[data-k="${selKey}"]`);if(el)el.scrollIntoView({block:"nearest",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}
}

// ===== 이벤트 =====
document.addEventListener("click",e=>{
  const tb=e.target.closest(".tab");if(tb){tab=tb.dataset.t;filter="all";selKey=null;fitted=false;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===tb));render();return}
  const ch=e.target.closest(".chip");if(ch){const l=ch.dataset.l;layers[l]=!layers[l];ch.setAttribute("aria-pressed",layers[l]);render();return}
  const st=e.target.closest("button.stat");if(st){filter=st.dataset.f;render();return}
  const tel=e.target.closest(".tel");if(tel){navigator.clipboard?.writeText(tel.dataset.tel).then(()=>{tel.textContent="복사됨";setTimeout(render,900)}).catch(()=>{});return}
  if(e.target.closest("a"))return;
  const rw=e.target.closest(".row");if(rw){select(rw.dataset.k,false)}
});
["q","dong","div","dept","hol"].forEach(id=>$("#"+id).addEventListener(id==="q"?"input":"change",()=>{fitted=false;render()}));
$("#sim").onchange=e=>{simTime=e.target.value?new Date(e.target.value).getTime():null;render()};
$("#now").onclick=()=>{simTime=null;$("#sim").value="";render()};
$("#zfit").onclick=()=>{selKey=null;fitted=false;render()};

render();loadAll();
setInterval(()=>{if(!simTime)render()},60000);   // 1분마다 영업 상태 재계산
setInterval(loadER,5*60000);                      // 5분마다 응급실 병상 재조회
setInterval(loadAll,60*60000);                    // 1시간마다 전체 재조회
</script>
</body>
</html>
