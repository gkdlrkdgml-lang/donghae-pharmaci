name: 의료기관 데이터 갱신

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다: 응급실 가용병상 (약국·병의원은 20시간마다 자동으로 함께 갱신)
    - cron: "50 20 * * *"    # 매일 05:50(한국시간): 약국·병의원 전체 새로 받기
  workflow_dispatch:         # Actions 탭에서 수동 실행 (전체 새로 받기)

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 공공데이터 API 조회
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "50 20 * * *" ]; then
            python update_data.py --daily
          else
            python update_data.py
          fi
      - name: 변경 내용 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- *.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
