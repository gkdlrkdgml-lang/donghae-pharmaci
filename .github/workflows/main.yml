name: 의료기관 데이터 갱신

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다: 응급실 가용병상 (약국·병의원은 20시간마다 자동으로 함께 갱신)
    - cron: "50 20 * * *"    # 매일 05:50(한국시간): 약국·병의원 전체 새로 받기
  workflow_dispatch:         # Actions 탭 수동 실행 또는 외부 예약(cron-job.org)
    inputs:
      full:
        description: "약국·병의원까지 전체 새로 받기"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 외부 실행 코드는 커밋 해시로 고정(무결성 검사 없는 코드 다운로드 방지) — v4.4.0 / v5.6.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: 공공데이터 API 조회
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          # 실행 조건 값은 환경변수로 넘김(스크립트에 직접 끼워 넣지 않음 — 명령어 삽입 방지)
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FULL: ${{ inputs.full }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_FULL" != "false" ] || [ "$EVENT_SCHEDULE" = "50 20 * * *" ]; then
            python update_data.py --daily
          else
            python update_data.py
          fi
      - name: 변경 내용 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- *.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
