name: 지역별 의료자원 목록 내보내기

# Actions 탭에서 수동 실행 전용. 결과는 엑셀 파일로 내려받으며, 사이트 데이터(json)는 바꾸지 않음
on:
  workflow_dispatch:
    inputs:
      sido:
        description: "시·도"
        type: choice
        default: 강원특별자치도
        options: [강원특별자치도, 서울특별시, 부산광역시, 대구광역시, 인천광역시, 광주광역시, 대전광역시, 울산광역시, 세종특별자치시, 경기도, 충청북도, 충청남도, 전북특별자치도, 전라남도, 경상북도, 경상남도, 제주특별자치도]
      sigungu:
        description: "시·군·구 (예: 영월군)"
        type: string
        default: 영월군

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
      - name: 공공데이터 조회 후 엑셀 만들기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          # 입력값은 환경변수로만 넘김(명령어에 직접 끼워 넣지 않음 — 명령어 삽입 방지)
          REGION_SIDO: ${{ inputs.sido }}
          REGION_SIGUNGU: ${{ inputs.sigungu }}
        run: |
          pip install --quiet openpyxl==3.1.5
          python export_region.py
      - name: 엑셀 파일 올리기
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: 의료자원현황
          path: out/*.xlsx
          retention-days: 7
